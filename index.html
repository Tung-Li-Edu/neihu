<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>內湖東立家教</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="內湖東立家教">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;
       padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
          justify-content:center;background:#fff;transition:opacity .35s;z-index:2;
          font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#20376c}
  #splash img{width:min(56vw,240px);height:auto}
  #splash b{margin-top:6px;font-size:30px;letter-spacing:.3em;font-family:"Songti TC","Noto Serif TC",serif}
  #splash p{margin-top:18px;font-size:15px;letter-spacing:.1em;opacity:.7}
  #splash.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="東立文理"><b>東立文理</b><p>載入中…</p></div>
<iframe id="app" title="內湖東立家教" allow="clipboard-write"></iframe>
<script>
  // ★ 東立內湖家教系統 的網頁應用程式網址（結尾是 /exec）
  var APP_URL = "https://script.google.com/macros/s/AKfycbxHCrxoyjwraLFNYG1_5SbsIm1rAiceqBCpFCxNE-ZxPNzEEUflt-kVNLdGOz0JcMU/exec";

  // 老師的專屬網址參數（例如 ?k=xxxx 或 ?admin）原封不動帶進系統
  // 第一次帶參數打開時記在手機裡；之後從桌面圖示打開（沒有參數）就自動帶回
  var KEY = "neihu-entry", q = location.search;
  try {
    if (q && q.length > 1) localStorage.setItem(KEY, q);
    else q = localStorage.getItem(KEY) || "";
  } catch (e) {}
  // ★ 幫裡面的系統保管登入資料、還沒上傳完的簽名（iPhone 會清掉嵌入網頁自己的資料，存在 App 這層才記得住）
  //   只接受 Google 系統送來的請求，而且只存取 jiajiao_ 開頭的資料
  window.addEventListener("message", function (e) {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data || {};
    try {
      if (d.type === "neihu-store-get") {
        var items = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf("jiajiao_") === 0) items[k] = localStorage.getItem(k);
        }
        e.source.postMessage({ type: "neihu-store-all", items: items }, e.origin);
      } else if (d.type === "neihu-store-set" && typeof d.key === "string" && d.key.indexOf("jiajiao_") === 0) {
        if (d.value == null) localStorage.removeItem(d.key); else localStorage.setItem(d.key, String(d.value));
      }
    } catch (x) {}
  });

  // ★ 加速：把記住的登入資料一起帶進系統，系統打開時就直接附上資料，不用再跑一趟
  var src = APP_URL + q;
  try {
    var slot = /[?&]admin(=|&|$)/.test(q) ? "jiajiao_tok_admin" : ((/[?&]k=([^&]+)/.exec(q) || [])[1] ? "jiajiao_tok_" + decodeURIComponent(/[?&]k=([^&]+)/.exec(q)[1]) : "");
    var tok = slot ? localStorage.getItem(slot) : "";
    if (tok) src += (q ? "&" : "?") + "_t=" + encodeURIComponent(tok);
  } catch (e) {}
  var frame = document.getElementById("app");
  frame.src = src;
  frame.addEventListener("load", function () {
    document.getElementById("splash").classList.add("hide");
  });
  setTimeout(function(){ document.getElementById("splash").classList.add("hide"); }, 8000);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
</script>
</body>
</html>
